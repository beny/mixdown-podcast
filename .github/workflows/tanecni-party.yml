name: Taneční Párty Weekly Run and Manual Trigger

permissions:
  contents: write

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tanecni-party.py script
        run: python tanecni-party.py

      - name: Configure git for commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes if tanecni-party.xml changed
        run: |
          if git diff --quiet --exit-code tanecni-party.xml; then
            echo "No changes in tanecni-party.xml to commit."
          else
            git add tanecni-party.xml
            git commit -m "Update tanecni-party.xml [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
