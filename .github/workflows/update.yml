name: Weekly Run and Manual Trigger

permissions:
  contents: write

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          # shazamio (nativní jádro) zatím není spolehlivé na 3.13+
          python-version: '3.12'

      - name: Install ffmpeg (for tracklist recognition)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run run.sh script
        run: |
          chmod +x ./run.sh
          ./run.sh

      - name: Configure git for commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes if feed or tracklists changed
        run: |
          git add mixdown.xml tracklists chapters
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update mixdown.xml [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
